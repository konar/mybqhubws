<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kindle Dashboard</title>
    <style>
        /* CSS Reset and Kindle Basics */
        html {
            overflow: hidden;
            background-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
            font-size: 150%;
            /* Increased by another 30% */
        }

        /* Prevent Focus Outlines (Kindle black border on click) */
        * {
            outline: none !important;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }

        /* Ensure injected scripts/hidden elements don't break layout */
        script,
        #awake-dot,
        .hidden-fix {
            display: none !important;
            width: 0;
            height: 0;
            overflow: hidden;
            position: absolute;
        }

        /* Layout */
        #container {
            /* Rotation for Landscape-only devices held in Portrait */
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            /* Transform handled by JS for precise legacy support */

            /* Layout */
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-flex-direction: column;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            flex-direction: column;
            -webkit-align-items: center;
            -webkit-box-align: center;
            align-items: center;
            -webkit-justify-content: flex-start;
            -webkit-box-pack: start;
            justify-content: flex-start;
            padding: 5px;
            /* Reduced padding to minimize blank space */
            box-sizing: border-box;
        }

        /* Date Header */
        #date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Align vertically */
            font-size: 3em;
            /* Very large for visibility */
            font-weight: bold;
            margin-bottom: 20px;
            width: 100%;
            padding-bottom: 1px;
            border: none !important;
            /* Force removal */
        }

        /* Hide Scrollbars */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
            display: none;
        }

        #header-date {
            text-align: left;
        }

        #header-countdown {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            /* Keep on one line if possible */
        }

        /* To-Do List */
        #todo-list {
            width: 100%;
            flex-grow: 1;
        }

        .todo-item {
            display: table;
            /* Reliable older browser layout */
            width: 100%;
            border-bottom: 1px solid #999;
            padding: 1px 0;
            font-size: 2em;
        }

        .todo-priority {
            display: table-cell;
            width: 40px;
            font-weight: bold;
            vertical-align: middle;
            padding-right: 15px;
        }

        .todo-desc {
            display: table-cell;
            vertical-align: middle;
        }

        /* Priority Styling */
        .priority-P0 {
            font-weight: 900;
        }

        /* Most important */
        .priority-P1 {
            font-weight: normal;
        }

        .priority-P2 {
            font-weight: lighter;
            color: #555;
        }

        /* Enforced Portrait Mode */
        #date-header {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;

            -webkit-flex-direction: row;
            -webkit-box-orient: horizontal;
            -webkit-box-direction: normal;
            flex-direction: row;

            -webkit-justify-content: space-between;
            -webkit-box-pack: justify;
            justify-content: space-between;

            -webkit-align-items: center;
            -webkit-box-align: center;
            align-items: center;

            font-size: 2em;
            width: 100%;
            /* Ensure width is explicit */
        }

        #header-date {
            text-align: left;
            width: auto;
            margin-bottom: 0;
        }

        #header-countdown {
            text-align: right;
            width: auto;
            margin-bottom: 0;
            font-size: 0.8em;
            /* Slightly smaller to fit */
        }



        .todo-item {
            font-size: 1.5em;
            /* Smaller font for remaining items */
        }

        /* Keep Awake / Status */
        #status-bar {
            font-size: 0.8em;
            color: #888;
            margin-top: 10px;
            text-align: center;
        }

        /* Error Message */
        #error-msg {
            display: none;
            color: black;
            font-weight: bold;
            font-size: 1.5em;
            margin-top: 20px;
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div id="container">
        <div id="date-header">
            <div id="header-date">Loading...</div>
            <div id="header-countdown"></div>
        </div>
        <div id="todo-list"></div>
        <div id="status-bar">Initializing...</div>
        <div id="error-msg"></div>
    </div>

    <script>
        // CONFIG
        var POLL_INTERVAL = 5 * 60 * 1000; // 5 minutes
        var CLOCK_INTERVAL = 1000; // 1 second
        var AWAKE_INTERVAL = 30 * 1000; // 30 seconds
        var SHEET_ID = "1cJj0Nfm3mq2S-KtJqcMh7meQFvavxzlqPWPmx37IVfk";

        // STATE
        var lastFetchTime = 0;

        // ELEMENTS
        var elHeaderDate = document.getElementById('header-date');
        var elHeaderCountdown = document.getElementById('header-countdown');
        var elList = document.getElementById('todo-list');
        var elStatus = document.getElementById('status-bar');
        var elError = document.getElementById('error-msg');

        // --- UTILS (ES5) ---



        function updateDate() {
            var now = new Date();
            var dateStr = "";
            var secondsLeft = 0;

            // Manual UTC-8 (PST) calculation for legacy browsers
            // 1. Get UTC time
            var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            // 2. Add -8 hours
            var pst = new Date(utc + (3600000 * -8));

            // Format: Thu 12/25
            var parts = pst.toDateString().split(' '); // Thu Dec 25 2025
            var dayName = parts[0];
            var month = pst.getMonth() + 1;
            var date = pst.getDate();
            dateStr = dayName + " " + month + "/" + date;

            var h = pst.getHours();
            var m = pst.getMinutes();
            var s = pst.getSeconds();
            var elapsed = (h * 3600) + (m * 60) + s;
            secondsLeft = 86400 - elapsed;

            if (elHeaderDate) elHeaderDate.textContent = dateStr;
            if (elHeaderCountdown) elHeaderCountdown.textContent = secondsLeft + " sec left";
        }

        function updateStatus(msg) {
            var now = new Date();
            var timeStr = "";

            // Manual UTC-8 (PST) calculation
            var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            var pst = new Date(utc + (3600000 * -8));
            var h = pst.getHours();
            var m = pst.getMinutes();
            // Pad minutes
            var mStr = m < 10 ? '0' + m : m;
            timeStr = h + ':' + mStr;

            elStatus.textContent = msg + " [ Last Check: " + timeStr + " ]";
        }

        function showError(msg) {
            elError.style.display = 'block';
            elError.textContent = "Error: " + msg;
        }

        function hideError() {
            elError.style.display = 'none';
        }

        // --- DATA FETCHING (JSONP) ---

        // Global callback for JSONP
        window.handleGvizResponse = function (json) {
            hideError();
            updateStatus("Updated");

            try {
                var rows = json.table.rows;
                var items = [];

                for (var i = 0; i < rows.length; i++) {
                    var row = rows[i];
                    // Col 0: Priority, Col 1: Description
                    // Check for null cells
                    var pCell = row.c[0];
                    var dCell = row.c[1];

                    var p = pCell ? (pCell.v || "") : "";
                    var d = dCell ? (dCell.v || "") : "";

                    // Skip empty rows or headers if they sneaked in
                    if (p === "Priority" && d === "Description") continue;
                    if (!p && !d) continue;

                    items.push({ p: p, d: d });
                }

                // Sort: P0 > P1 > P2 > P3
                items.sort(function (a, b) {
                    return (a.p || "").localeCompare(b.p || "");
                });

                renderList(items);

            } catch (e) {
                showError("Parse Failed");
                // console.error(e);
            }
        };

        function fetchData() {
            updateStatus("Refreshing...");

            // Remove old script if exists
            var oldScript = document.getElementById('gviz-script');
            if (oldScript) {
                oldScript.parentNode.removeChild(oldScript);
            }

            var script = document.createElement('script');
            script.id = 'gviz-script';
            // JSONP URL
            var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=responseHandler:handleGvizResponse&gid=0&t=" + new Date().getTime();

            script.src = url;
            script.onerror = function () {
                showError("Network Error");
                updateStatus("Net Error");
            };

            document.body.appendChild(script);
        }

        function renderList(items) {
            elList.innerHTML = ''; // Clear

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var div = document.createElement('div');
                div.className = 'todo-item';

                // Truncate desc to ~6 words
                var words = item.d.split(' ');
                var displayDesc = item.d;
                if (words.length > 6) {
                    displayDesc = words.slice(0, 6).join(' ') + '...';
                }

                var pClass = 'priority-' + item.p; // e.g. priority-P0

                div.innerHTML =
                    '<div class="todo-priority ' + pClass + '">' + item.p + '</div>' +
                    '<div class="todo-desc">' + displayDesc + '</div>';

                elList.appendChild(div);
            }
        }

        // --- KEEP AWAKE ---

        // --- KEEP AWAKE ---

        function keepAwake() {
            // Strategy 1: Hidden state toggle (force repaint without layout shift)
            var dot = document.getElementById('awake-dot');
            if (!dot) {
                dot = document.createElement('div');
                dot.id = 'awake-dot';
                dot.className = 'hidden-fix';
                // Styles managed in CSS to be absolutely hidden
                document.body.appendChild(dot);
            }
            // Toggle something irrelevant to trigger repaint
            dot.style.opacity = (dot.style.opacity === '0.01' ? '0.02' : '0.01');
        }

        // --- LAYOUT FIXES ---
        function resizeContainer() {
            // Force container to match swapped screen dimensions
            // We want Visual Width = Window Width
            // Visual Height = Window Height

            // Logical Width = Visual Height
            var w = window.innerHeight;
            // Logical Height = Visual Width
            var h = window.innerWidth;

            var container = document.getElementById('container');

            // Subtract 2px to ensure we are strictly inside the viewport and don't trigger scrollbars
            container.style.width = (w - 2) + 'px';
            container.style.height = (h - 2) + 'px';
            container.style.position = 'fixed';
            container.style.top = '0px';
            container.style.left = '0px';

            // Reset transforms to base state + new rotation logic
            // Strategy: Anchor Top-Left (0,0). 
            // 1. Pivot at 0,0.
            // 2. Shift Left by Width (translateX(-100%)) so Top-Right is at 0,0.
            // 3. Rotate 270deg around 0,0.
            // Result: Fills the screen starting from 0,0 downwards/rightwards.

            container.style.transformOrigin = '0% 0%';
            container.style.webkitTransformOrigin = '0% 0%';

            // Logic:
            // 1. We start at 0,0.
            // 2. We want to Rotate 270 (CW).
            //    This throws the element upwards (negative Y).
            //    Rotate 270 means X axis becomes -Y axis.
            // 3. To compensate, we need to push it DOWN by the WIDTH of the container.
            //    Translation applies in the screen coordinate system if done before rotation? 
            //    Actually, lets rely on standard matrix order: Translate * Rotate.
            //    Translate (move origin) -> then Rotate around new origin.

            var transform = 'translate(0px, ' + w + 'px) rotate(270deg)';

            container.style.transform = transform;
            container.style.webkitTransform = transform;
            container.style.mozTransform = transform;
            container.style.msTransform = transform;
            container.style.oTransform = transform;


            // var debugMsg = "Win:" + window.innerWidth + "x" + window.innerHeight;
            // updateStatus("Reflow V2 " + debugMsg);
        }

        window.onresize = resizeContainer;

        // --- INITIALIZATION ---

        function init() {
            // Delay resize slightly to ensure viewport meta applies
            setTimeout(resizeContainer, 100);
            updateDate();
            fetchData(); // Initial Fetch

            // Timers
            setInterval(fetchData, POLL_INTERVAL);
            setInterval(updateDate, CLOCK_INTERVAL);
            setInterval(keepAwake, AWAKE_INTERVAL);
        }

        // Start
        init();

    </script>
</body>

</html>
